name: locations

# ADR-03 provider-locations refresh (ODS names/postcodes + ONSPD coordinates).
# Deliberately manual: locations churn is rare and the ONSPD zip is ~250MB —
# this must never ride on the 2x/day RTT ingest. Cadence + legal conditions:
# pipeline/SOURCES/ods-locations.md and pipeline/SOURCES/onspd.md.
on:
  workflow_dispatch:

permissions:
  contents: write

# Shares the ingest concurrency group: a locations refresh never races the
# scheduled ingest or a backfill (all three mutate this repo's data layer).
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  locations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (locations helpers)
        run: python3 -m unittest discover -s scripts -p 'test_locations*.py' -v

      - name: Resolve provider codes via ODS (ORD API — legal contract in ods-locations.md)
        run: python3 scripts/locations.py ods

      - name: Download latest ONSPD (Open Geography Portal discovery)
        run: python3 scripts/locations.py onspd

      - name: Build + gates (BT-strip G-L3, completeness >=95%, sanity) + stage publish
        run: python3 scripts/locations.py build

      - name: Commit + push locations layer
        run: |
          git config user.name "nhswaits-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/locations state/locations_history.jsonl
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            RATE="$(python3 -c "import json;d=json.load(open('data/locations/providers.json'));print(f\"{d['resolution']['resolved']}/{d['resolution']['total_codes']}\")")"
            EDITION="$(python3 -c "import json;print(json.load(open('data/locations/providers.json'))['onspd_edition'])")"
            git commit -m "locations: refresh (${RATE} resolved, ${EDITION})"
            git push
          fi

      - name: Heartbeat (PLACEHOLDER — Healthchecks.io not provisioned, batch #0 gap)
        if: success()
        run: |
          # DEVIATION (testrun): no Healthchecks.io account exists yet (owner
          # batch #0 item). In production this step is, per STANDARD-data-pipeline §6:
          #   curl -fsS --retry 3 "https://hc-ping.com/$HEALTHCHECKS_LOCATIONS_UUID"
          # (a SEPARATE check from the ingest one — manual cadence means its
          # grace period is measured in months, not hours)
          echo "HEARTBEAT-PLACEHOLDER: would ping hc-ping.com/<locations-uuid> here (success only)"
